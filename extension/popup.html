<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexDL</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <form id="download-form" novalidate>
        <div class="url-field">
          <label class="sr-only" for="media-url">Paste a link</label>
          <svg class="url-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10.25 13.75a3.5 3.5 0 0 0 4.95 0l3.05-3.05a3.5 3.5 0 0 0-4.95-4.95l-1.75 1.75" />
            <path d="M13.75 10.25a3.5 3.5 0 0 0-4.95 0L5.75 13.3a3.5 3.5 0 0 0 4.95 4.95l1.75-1.75" />
          </svg>
          <input
            id="media-url"
            name="url"
            type="url"
            inputmode="url"
            autocomplete="url"
            placeholder="Paste a link"
            required
          />
          <button
            id="clear-url"
            class="clear-button"
            type="button"
            aria-label="Clear link"
            hidden
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M5 5l10 10M15 5L5 15" />
            </svg>
          </button>
        </div>

        <div class="format-switch" role="group" aria-label="Format">
          <button
            class="format-option is-active"
            type="button"
            data-format="video"
            aria-pressed="true"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path class="filled-icon" d="M6.5 4.6a1 1 0 0 1 1.5-.86l7.7 5.4a1 1 0 0 1 0 1.72L8 16.26a1 1 0 0 1-1.5-.86V4.6Z" />
            </svg>
            <span>Video</span>
          </button>
          <button
            class="format-option"
            type="button"
            data-format="mp3"
            aria-pressed="false"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M8 14.4V5.3l7-1.7v9.1" />
              <ellipse cx="5.7" cy="15.2" rx="2.7" ry="2" />
              <ellipse cx="12.7" cy="13.4" rx="2.7" ry="2" />
            </svg>
            <span>MP3</span>
          </button>
        </div>

        <div class="quality-field">
          <label for="quality">Quality</label>
          <div class="select-wrap">
            <select id="quality" name="quality"></select>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 7l6 6 6-6" />
            </svg>
          </div>
        </div>

        <button id="submit-button" class="download-button" type="submit">
          <span class="button-label">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M10 2.8v9.4M6.5 8.9 10 12.4l3.5-3.5M4 16.2h12" />
            </svg>
            <span>Download</span>
          </span>
          <span class="button-loader" aria-hidden="true"></span>
        </button>

        <section id="progress-panel" class="progress-panel" hidden aria-live="polite">
          <div class="progress-copy">
            <span id="progress-label">Preparing…</span>
            <span id="progress-value">0 %</span>
          </div>
          <div
            class="progress-track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span id="progress-bar"></span>
          </div>
          <button id="cancel-button" class="cancel-button" type="button">Cancel</button>
        </section>

        <p id="form-error" class="form-error" role="alert" hidden></p>
      </form>

      <footer class="service-status" aria-live="polite">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Connecting…</span>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
